spring.application.name=resume-matcher-backend
server.port=8080

# --- Database (values come from environment variables) ---
# useSSL=false and allowPublicKeyRetrieval=true are for LOCAL development only
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_matcher?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:resume_user}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}