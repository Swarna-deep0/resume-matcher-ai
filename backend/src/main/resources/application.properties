spring.application.name=resume-matcher-backend
server.port=8080

# --- Database (values come from environment variables) ---
# useSSL=false and allowPublicKeyRetrieval=true are for LOCAL development only
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_matcher?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:resume_user}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# --- Upload limits ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.max-bytes=5242880
server.tomcat.max-swallow-size=10MB

# --- AI service (FastAPI) ---
app.ai-service.base-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.ai-service.api-key=${AI_SERVICE_API_KEY}
app.ai-service.connect-timeout-ms=2000
app.ai-service.read-timeout-ms=15000

# --- Logging: show the request id on every line ---
logging.pattern.correlation=[%X{requestId:-}]\u0020

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE